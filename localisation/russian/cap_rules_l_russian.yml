l_russian:
 CAP_RULE_AFFECTED: "Пожалуйста, сдавайтесь: кого затрагивает"
 CAP_RULE_AFFECTED_DESC: "Какие страны накапливают штраф к стабильности и поддержке войны при приближении к капитуляции и гасят его, когда она далеко. «Только ИИ» не затрагивает игроков."
 CAP_RULE_LOSS_START: "Пожалуйста, сдавайтесь: начало потерь"
 CAP_RULE_LOSS_START_DESC: "Уровень капитуляции, с которого начинается ежемесячное снижение стабильности и поддержки войны."
 CAP_RULE_LOSS_FULL: "Пожалуйста, сдавайтесь: максимум потерь при"
 CAP_RULE_LOSS_FULL_DESC: "Уровень капитуляции, при котором ежемесячные потери достигают максимума. Между началом и этим значением потери растут по кривой easeInOutQuad."
 CAP_RULE_STAB_LOSS_MAX: "Пожалуйста, сдавайтесь: максимальная потеря стабильности в месяц"
 CAP_RULE_STAB_LOSS_MAX_DESC: "Наибольший ежемесячный прирост штрафа к стабильности, в процентных пунктах."
 CAP_RULE_WS_LOSS_MAX: "Пожалуйста, сдавайтесь: максимальная потеря поддержки войны в месяц"
 CAP_RULE_WS_LOSS_MAX_DESC: "Наибольший ежемесячный прирост штрафа к поддержке войны, в процентных пунктах."
 CAP_RULE_PEN_LIMIT: "Пожалуйста, сдавайтесь: предел штрафа"
 CAP_RULE_PEN_LIMIT_DESC: "Наибольший штраф к стабильности и к поддержке войны, который может накопиться, в процентных пунктах суммарно. Сам показатель при этом не опускается ниже −50%."
 CAP_RULE_RECOVERY_BELOW: "Пожалуйста, сдавайтесь: восстановление при капитуляции ниже"
 CAP_RULE_RECOVERY_BELOW_DESC: "Страна с уровнем капитуляции ниже этого значения каждый месяц гасит штраф к стабильности и поддержке войны, на войне и в мирное время. «Выкл» отключает восстановление."
 CAP_RULE_STAB_RECOVERY: "Пожалуйста, сдавайтесь: восстановление стабильности в месяц"
 CAP_RULE_STAB_RECOVERY_DESC: "Насколько уменьшается штраф к стабильности за месяц, в процентных пунктах, до учёта силы врагов. Штраф не уходит ниже нуля, поэтому выше обычного уровня стабильность не поднимается."
 CAP_RULE_WS_RECOVERY: "Пожалуйста, сдавайтесь: восстановление поддержки войны в месяц"
 CAP_RULE_WS_RECOVERY_DESC: "Насколько уменьшается штраф к поддержке войны за месяц, в процентных пунктах, до учёта силы врагов. Штраф не уходит ниже нуля, поэтому выше обычного уровня поддержка войны не поднимается."
 CAP_RULE_RECOVERY_SCALE: "Пожалуйста, сдавайтесь: учёт силы врагов при восстановлении"
 CAP_RULE_RECOVERY_SCALE_DESC: "Если включено, погашение штрафа на войне умножается на отношение силы вражеских армий к силе вашей (не больше 1), поэтому нападение на гораздо более слабую страну почти ничего не даёт. В мирное время погашение всегда полное."
 CAP_OPT_ALL: "Все страны"
 CAP_OPT_AI_ONLY: "Только ИИ"
 CAP_OPT_PLAYERS_ONLY: "Только игроки"
 CAP_OPT_OFF: "Выкл"
