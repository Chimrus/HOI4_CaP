l_polish:
 CAP_RULE_AFFECTED: "Poddajcie się, proszę: objęte kraje"
 CAP_RULE_AFFECTED_DESC: "Które kraje gromadzą dodatkową opłatę wojenną, obniżającą stabilizację i poparcie wojny, w miarę zbliżania się do kapitulacji i spłacają ją, gdy są od niej daleko. Opcja 'Tylko SI' nie pozwala, by mechanika dotyczyła graczy."
 CAP_RULE_LOSS_START: "Poddajcie się, proszę: początek strat przy"
 CAP_RULE_LOSS_START_DESC: "Postęp kapitulacji, przy którym zaczyna się miesięczny spadek stabilizacji i poparcia wojny."
 CAP_RULE_LOSS_FULL: "Poddajcie się, proszę: maksymalne straty przy"
 CAP_RULE_LOSS_FULL_DESC: "Postęp kapitulacji, przy którym miesięczny spadek osiąga maksimum. Między początkiem a tą wartością spadek rośnie po krzywej easeInOutQuad."
 CAP_RULE_STAB_LOSS_MAX: "Poddajcie się, proszę: maksymalna miesięczna utrata stabilizacji"
 CAP_RULE_STAB_LOSS_MAX_DESC: "Największa wartość, o jaką dodatkowa opłata wojenna obniżająca stabilizację może wzrosnąć miesięcznie, w punktach procentowych."
 CAP_RULE_WS_LOSS_MAX: "Poddajcie się, proszę: maksymalna miesięczna utrata poparcia wojny"
 CAP_RULE_WS_LOSS_MAX_DESC: "Największa wartość, o jaką dodatkowa opłata wojenna obniżająca poparcie wojny może wzrosnąć miesięcznie, w punktach procentowych."
 CAP_RULE_PEN_LIMIT: "Poddajcie się, proszę: limit dodatkowej opłaty wojennej"
 CAP_RULE_PEN_LIMIT_DESC: "Największa wartość, do jakiej mogą narosnąć dodatkowa opłata wojenna obniżająca stabilizację i dodatkowa opłata wojenna obniżająca poparcie wojny (każda z osobna), w punktach procentowych łącznie. Sama wynikowa wartość nigdy nie spada poniżej −50%."
 CAP_RULE_RECOVERY_BELOW: "Poddajcie się, proszę: regeneracja poniżej"
 CAP_RULE_RECOVERY_BELOW_DESC: "Kraj, którego postęp kapitulacji jest poniżej tej wartości, co miesiąc spłaca dodatkową opłatę wojenną obniżającą stabilizację i poparcie wojny, w czasie wojny i pokoju. Opcja 'Wyłączone' wyłącza regenerację."
 CAP_RULE_STAB_RECOVERY: "Poddajcie się, proszę: miesięczna regeneracja stabilizacji"
 CAP_RULE_STAB_RECOVERY_DESC: "Jaka część dodatkowej opłaty wojennej obniżającej stabilizację jest spłacana miesięcznie, w punktach procentowych, przed przeskalowaniem według siły wrogów. Opłata nie może spaść poniżej zera, więc stabilizacja nigdy nie rośnie powyżej swojego normalnego poziomu."
 CAP_RULE_WS_RECOVERY: "Poddajcie się, proszę: miesięczna regeneracja poparcia wojny"
 CAP_RULE_WS_RECOVERY_DESC: "Jaka część dodatkowej opłaty wojennej obniżającej poparcie wojny jest spłacana miesięcznie, w punktach procentowych, przed przeskalowaniem według siły wrogów. Opłata nie może spaść poniżej zera, więc poparcie wojny nigdy nie rośnie powyżej swojego normalnego poziomu."
 CAP_RULE_RECOVERY_SCALE: "Poddajcie się, proszę: skalowanie regeneracji według siły wrogów"
 CAP_RULE_RECOVERY_SCALE_DESC: "Jeśli włączone, spłata w czasie wojny jest mnożona przez stosunek siły armii wrogów do siły własnej armii (maksymalnie 1), więc atakowanie znacznie słabszego kraju spłaca niewiele. W czasie pokoju spłata jest zawsze pełna."
 CAP_OPT_ALL: "Wszystkie kraje"
 CAP_OPT_AI_ONLY: "Tylko SI"
 CAP_OPT_PLAYERS_ONLY: "Tylko gracze"
 CAP_OPT_OFF: "Wyłączone"
