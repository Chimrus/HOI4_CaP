l_korean:
 CAP_RULE_AFFECTED: "제발 항복해 주세요: 영향을 받는 국가"
 CAP_RULE_AFFECTED_DESC: "항복에 가까워질수록 안정도와 전쟁 지지도 악화가 쌓이고, 항복에서 멀어지면 이를 해소하는 국가의 범위를 정합니다. 'AI만'을 선택하면 플레이어에게는 이 효과가 적용되지 않습니다."
 CAP_RULE_LOSS_START: "제발 항복해 주세요: 감소 시작 지점"
 CAP_RULE_LOSS_START_DESC: "안정도와 전쟁 지지도의 주간 감소가 시작되는 항복 현황입니다."
 CAP_RULE_LOSS_FULL: "제발 항복해 주세요: 최대 감소 지점"
 CAP_RULE_LOSS_FULL_DESC: "주간 감소량이 최대치에 달하는 항복 현황입니다. 감소 시작 지점부터 이 값까지는 감소량이 easeInOutQuad 곡선을 따라 커집니다."
 CAP_RULE_STAB_LOSS_MAX: "제발 항복해 주세요: 주간 최대 안정도 감소량"
 CAP_RULE_STAB_LOSS_MAX_DESC: "안정도 악화가 매주 늘어날 수 있는 최대치이며, 단위는 퍼센트포인트입니다."
 CAP_RULE_WS_LOSS_MAX: "제발 항복해 주세요: 주간 최대 전쟁 지지도 감소량"
 CAP_RULE_WS_LOSS_MAX_DESC: "전쟁 지지도 악화가 매주 늘어날 수 있는 최대치이며, 단위는 퍼센트포인트입니다."
 CAP_RULE_MAJOR_SCALE: "제발 항복해 주세요: 강대국 감소량"
 CAP_RULE_MAJOR_SCALE_DESC: "강대국(게임의 ‘강대국’ 지위를 가진, 산업력이 가장 큰 국가들)은 안정도와 전쟁 지지도가 더 느리게 감소합니다. 주간 감소량에 이 값이 곱해집니다. 100%는 다른 국가와 같은 감소량을 뜻합니다. 회복에는 영향이 없습니다."
 CAP_RULE_PEN_LIMIT: "제발 항복해 주세요: 악화 한도"
 CAP_RULE_PEN_LIMIT_DESC: "안정도 악화와 전쟁 지지도 악화가 각각 최대로 쌓일 수 있는 총량이며, 단위는 퍼센트포인트입니다. 수치 자체는 −50% 아래로 내려가지 않습니다."
 CAP_RULE_RECOVERY_BELOW: "제발 항복해 주세요: 항복 현황이 다음 미만일 때 회복"
 CAP_RULE_RECOVERY_BELOW_DESC: "항복 현황이 이 값 미만인 국가는 전쟁 중이든 평시든 매주 안정도와 전쟁 지지도 악화를 해소합니다. '끔'을 선택하면 회복이 비활성화됩니다."
 CAP_RULE_STAB_RECOVERY: "제발 항복해 주세요: 주간 안정도 회복량"
 CAP_RULE_STAB_RECOVERY_DESC: "적 전력비에 따른 조정을 적용하기 전, 매주 해소되는 안정도 악화의 양이며 단위는 퍼센트포인트입니다. 악화는 0 아래로 내려갈 수 없으므로 안정도가 정상 수준을 넘어 오르는 일은 없습니다."
 CAP_RULE_WS_RECOVERY: "제발 항복해 주세요: 주간 전쟁 지지도 회복량"
 CAP_RULE_WS_RECOVERY_DESC: "적 전력비에 따른 조정을 적용하기 전, 매주 해소되는 전쟁 지지도 악화의 양이며 단위는 퍼센트포인트입니다. 악화는 0 아래로 내려갈 수 없으므로 전쟁 지지도가 정상 수준을 넘어 오르는 일은 없습니다."
 CAP_RULE_RECOVERY_SCALE: "제발 항복해 주세요: 회복량에 적 전력비 반영"
 CAP_RULE_RECOVERY_SCALE_DESC: "활성화하면 전쟁 중의 해소량에 자국군 전력 대비 적군 전력의 비율(최대 1)이 곱해지므로, 훨씬 약한 국가를 공격해서는 거의 해소되지 않습니다. 평시의 해소량은 항상 전부 적용됩니다."
 CAP_OPT_ALL: "모든 국가"
 CAP_OPT_AI_ONLY: "AI만"
 CAP_OPT_PLAYERS_ONLY: "플레이어만"
 CAP_OPT_OFF: "끔"
