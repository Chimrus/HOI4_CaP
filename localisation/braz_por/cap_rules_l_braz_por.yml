l_braz_por:
 CAP_RULE_AFFECTED: "Por favor, rendam-se: países afetados"
 CAP_RULE_AFFECTED_DESC: "Quais países acumulam uma penalidade de estabilidade e Apoio à Guerra ao se aproximarem da rendição e a abatem quando estão longe dela. 'Apenas IA' mantém a mecânica longe dos jogadores."
 CAP_RULE_LOSS_START: "Por favor, rendam-se: início da perda"
 CAP_RULE_LOSS_START_DESC: "Progresso de rendição em que começa a perda mensal de estabilidade e Apoio à Guerra."
 CAP_RULE_LOSS_FULL: "Por favor, rendam-se: perda máxima atingida em"
 CAP_RULE_LOSS_FULL_DESC: "Progresso de rendição em que a perda mensal chega ao máximo. Entre o início e este valor, a perda cresce seguindo a curva easeInOutQuad."
 CAP_RULE_STAB_LOSS_MAX: "Por favor, rendam-se: perda mensal máxima de estabilidade"
 CAP_RULE_STAB_LOSS_MAX_DESC: "O máximo que a penalidade de estabilidade pode crescer por mês, em pontos percentuais."
 CAP_RULE_WS_LOSS_MAX: "Por favor, rendam-se: perda mensal máxima de Apoio à Guerra"
 CAP_RULE_WS_LOSS_MAX_DESC: "O máximo que a penalidade de Apoio à Guerra pode crescer por mês, em pontos percentuais."
 CAP_RULE_PEN_LIMIT: "Por favor, rendam-se: limite da penalidade"
 CAP_RULE_PEN_LIMIT_DESC: "O máximo que a penalidade de estabilidade e a penalidade de Apoio à Guerra podem acumular cada uma, em pontos percentuais no total. O valor resultante em si nunca cai abaixo de −50%."
 CAP_RULE_RECOVERY_BELOW: "Por favor, rendam-se: recuperação abaixo de"
 CAP_RULE_RECOVERY_BELOW_DESC: "Um país com progresso de rendição abaixo deste valor abate sua penalidade de estabilidade e Apoio à Guerra todo mês, em guerra ou em paz. 'Desligado' desativa a recuperação."
 CAP_RULE_STAB_RECOVERY: "Por favor, rendam-se: recuperação mensal de estabilidade"
 CAP_RULE_STAB_RECOVERY_DESC: "Quanto da penalidade de estabilidade é abatido por mês, em pontos percentuais, antes do ajuste pela força do inimigo. A penalidade não pode ficar abaixo de zero, então a estabilidade nunca sobe acima do nível normal."
 CAP_RULE_WS_RECOVERY: "Por favor, rendam-se: recuperação mensal de Apoio à Guerra"
 CAP_RULE_WS_RECOVERY_DESC: "Quanto da penalidade de Apoio à Guerra é abatido por mês, em pontos percentuais, antes do ajuste pela força do inimigo. A penalidade não pode ficar abaixo de zero, então o Apoio à Guerra nunca sobe acima do nível normal."
 CAP_RULE_RECOVERY_SCALE: "Por favor, rendam-se: recuperação proporcional à força do inimigo"
 CAP_RULE_RECOVERY_SCALE_DESC: "Se ativado, em guerra o abatimento é multiplicado pela razão entre a força do exército inimigo e a do seu próprio (no máximo 1), então atacar um país muito mais fraco abate pouco. Em paz o abatimento é sempre integral."
 CAP_OPT_ALL: "Todos os países"
 CAP_OPT_AI_ONLY: "Apenas IA"
 CAP_OPT_PLAYERS_ONLY: "Apenas jogadores"
 CAP_OPT_OFF: "Desligado"
