l_english:
 CAP_RULE_AFFECTED: "Please surrender: affected countries"
 CAP_RULE_AFFECTED_DESC: "Which countries build up a stability and war support penalty as they approach surrender, and pay it off when they are far from it. 'AI only' keeps the mechanic away from players."
 CAP_RULE_LOSS_START: "Please surrender: drain starts at"
 CAP_RULE_LOSS_START_DESC: "Surrender progress at which the weekly drain of stability and war support begins."
 CAP_RULE_LOSS_FULL: "Please surrender: maximum drain at"
 CAP_RULE_LOSS_FULL_DESC: "Surrender progress at which the weekly drain reaches its maximum. Between the start and this value the drain grows along an easeInOutQuad curve."
 CAP_RULE_STAB_LOSS_MAX: "Please surrender: maximum weekly stability loss"
 CAP_RULE_STAB_LOSS_MAX_DESC: "The most the stability penalty can grow per week, in percentage points."
 CAP_RULE_WS_LOSS_MAX: "Please surrender: maximum weekly war support loss"
 CAP_RULE_WS_LOSS_MAX_DESC: "The most the war support penalty can grow per week, in percentage points."
 CAP_RULE_MAJOR_SCALE: "Please surrender: drain of major countries"
 CAP_RULE_MAJOR_SCALE_DESC: "Major countries (the game's own Major Country status: the largest industrial powers) lose stability and war support more slowly: their weekly drain is multiplied by this value. 100% means the same drain as everyone else. Recovery is not affected."
 CAP_RULE_PEN_LIMIT: "Please surrender: penalty limit"
 CAP_RULE_PEN_LIMIT_DESC: "The most the stability penalty and the war support penalty can each build up, in percentage points in total. The resulting value itself never drops below −50%."
 CAP_RULE_RECOVERY_BELOW: "Please surrender: recovery below"
 CAP_RULE_RECOVERY_BELOW_DESC: "A country with surrender progress below this value pays off its stability and war support penalty every week, at war or in peace. 'Off' disables recovery."
 CAP_RULE_STAB_RECOVERY: "Please surrender: weekly stability recovery"
 CAP_RULE_STAB_RECOVERY_DESC: "How much of the stability penalty is paid off per week, in percentage points, before scaling by enemy strength. The penalty cannot drop below zero, so stability never rises above its normal level."
 CAP_RULE_WS_RECOVERY: "Please surrender: weekly war support recovery"
 CAP_RULE_WS_RECOVERY_DESC: "How much of the war support penalty is paid off per week, in percentage points, before scaling by enemy strength. The penalty cannot drop below zero, so war support never rises above its normal level."
 CAP_RULE_RECOVERY_SCALE: "Please surrender: scale recovery by enemy strength"
 CAP_RULE_RECOVERY_SCALE_DESC: "If enabled, the payoff at war is multiplied by the ratio of enemy army strength to your own (at most 1), so attacking a much weaker country pays off little. In peace the payoff is always full."
 CAP_OPT_ALL: "All countries"
 CAP_OPT_AI_ONLY: "AI only"
 CAP_OPT_PLAYERS_ONLY: "Players only"
 CAP_OPT_OFF: "Off"
