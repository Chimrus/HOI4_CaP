l_spanish:
 CAP_RULE_AFFECTED: "Ríndanse, por favor: países afectados"
 CAP_RULE_AFFECTED_DESC: "Qué países acumulan una penalización de estabilidad y apoyo bélico al acercarse a la rendición, y la saldan cuando están lejos de ella. «Solo la IA» mantiene la mecánica alejada de los jugadores."
 CAP_RULE_LOSS_START: "Ríndanse, por favor: la pérdida empieza con"
 CAP_RULE_LOSS_START_DESC: "Progreso de rendición con el que empieza la pérdida semanal de estabilidad y apoyo bélico."
 CAP_RULE_LOSS_FULL: "Ríndanse, por favor: la pérdida máxima se alcanza con"
 CAP_RULE_LOSS_FULL_DESC: "Progreso de rendición con el que la pérdida semanal alcanza su máximo. Entre el inicio y este valor, la pérdida crece siguiendo la curva easeInOutQuad."
 CAP_RULE_STAB_LOSS_MAX: "Ríndanse, por favor: pérdida semanal máxima de estabilidad"
 CAP_RULE_STAB_LOSS_MAX_DESC: "La mayor cantidad en que puede crecer la penalización de estabilidad a la semana, en puntos porcentuales."
 CAP_RULE_WS_LOSS_MAX: "Ríndanse, por favor: pérdida semanal máxima de apoyo bélico"
 CAP_RULE_WS_LOSS_MAX_DESC: "La mayor cantidad en que puede crecer la penalización de apoyo bélico a la semana, en puntos porcentuales."
 CAP_RULE_MAJOR_SCALE: "Ríndanse, por favor: pérdida de las grandes potencias"
 CAP_RULE_MAJOR_SCALE_DESC: "Las grandes potencias (el propio estatus de gran potencia del juego: las mayores potencias industriales) pierden estabilidad y apoyo bélico más despacio: su pérdida semanal se multiplica por este valor. 100% significa la misma pérdida que la de todos los demás. La recuperación no se ve afectada."
 CAP_RULE_PEN_LIMIT: "Ríndanse, por favor: límite de penalización"
 CAP_RULE_PEN_LIMIT_DESC: "El máximo que puede acumular cada una de las penalizaciones, la de estabilidad y la de apoyo bélico, en puntos porcentuales en total. El propio valor resultante nunca baja de −50%."
 CAP_RULE_RECOVERY_BELOW: "Ríndanse, por favor: recuperación por debajo de"
 CAP_RULE_RECOVERY_BELOW_DESC: "Un país con un progreso de rendición inferior a este valor salda cada semana su penalización de estabilidad y apoyo bélico, en guerra o en paz. «Desactivada» desactiva la recuperación."
 CAP_RULE_STAB_RECOVERY: "Ríndanse, por favor: recuperación semanal de estabilidad"
 CAP_RULE_STAB_RECOVERY_DESC: "Cuánto de la penalización de estabilidad se salda a la semana, en puntos porcentuales, antes de aplicar la proporción de fuerzas del enemigo. La penalización no puede bajar de cero, así que la estabilidad nunca sube por encima de su nivel normal."
 CAP_RULE_WS_RECOVERY: "Ríndanse, por favor: recuperación semanal de apoyo bélico"
 CAP_RULE_WS_RECOVERY_DESC: "Cuánto de la penalización de apoyo bélico se salda a la semana, en puntos porcentuales, antes de aplicar la proporción de fuerzas del enemigo. La penalización no puede bajar de cero, así que el apoyo bélico nunca sube por encima de su nivel normal."
 CAP_RULE_RECOVERY_SCALE: "Ríndanse, por favor: recuperación según la fuerza del enemigo"
 CAP_RULE_RECOVERY_SCALE_DESC: "Si está activada, en guerra la cantidad saldada se multiplica por la proporción entre la fuerza de los ejércitos enemigos y la de tu propio ejército (con un tope de 1), así que atacar a un país mucho más débil salda poco. En paz la cantidad saldada siempre es completa."
 CAP_OPT_ALL: "Todos los países"
 CAP_OPT_AI_ONLY: "Solo la IA"
 CAP_OPT_PLAYERS_ONLY: "Solo los jugadores"
 CAP_OPT_OFF: "Desactivada"
