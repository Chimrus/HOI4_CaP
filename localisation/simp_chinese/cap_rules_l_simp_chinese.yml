l_simp_chinese:
 CAP_RULE_AFFECTED: "请投降：受影响的国家"
 CAP_RULE_AFFECTED_DESC: "哪些国家在接近投降时会累积稳定度和战争支持度惩罚，并在远离投降时将其消减。选择“仅限AI”则该机制不会作用于玩家。"
 CAP_RULE_LOSS_START: "请投降：开始消耗的投降进度"
 CAP_RULE_LOSS_START_DESC: "每周开始消耗稳定度和战争支持度时的投降进度。"
 CAP_RULE_LOSS_FULL: "请投降：消耗达到最大值的投降进度"
 CAP_RULE_LOSS_FULL_DESC: "每周消耗达到最大值时的投降进度。在起始值与该值之间，消耗沿easeInOutQuad曲线增长。"
 CAP_RULE_STAB_LOSS_MAX: "请投降：每周稳定度最大损失"
 CAP_RULE_STAB_LOSS_MAX_DESC: "稳定度惩罚每周最多可增加的数值，以百分点计。"
 CAP_RULE_WS_LOSS_MAX: "请投降：每周战争支持度最大损失"
 CAP_RULE_WS_LOSS_MAX_DESC: "战争支持度惩罚每周最多可增加的数值，以百分点计。"
 CAP_RULE_MAJOR_SCALE: "请投降：主要国家的消耗"
 CAP_RULE_MAJOR_SCALE_DESC: "主要国家（游戏自带的“主要国家”地位：工业规模最大的强国）损失稳定度和战争支持度的速度更慢：其每周消耗会乘以该值。100%表示与其他国家的消耗相同。恢复不受影响。"
 CAP_RULE_PEN_LIMIT: "请投降：惩罚上限"
 CAP_RULE_PEN_LIMIT_DESC: "稳定度惩罚和战争支持度惩罚各自最多可累积的数值，以百分点计的总量。最终数值本身永远不会低于−50%。"
 CAP_RULE_RECOVERY_BELOW: "请投降：低于此投降进度时恢复"
 CAP_RULE_RECOVERY_BELOW_DESC: "投降进度低于该值的国家，无论交战还是和平，每周都会消减其稳定度和战争支持度惩罚。选择“关闭”则停用恢复。"
 CAP_RULE_STAB_RECOVERY: "请投降：每周稳定度恢复量"
 CAP_RULE_STAB_RECOVERY_DESC: "每周消减的稳定度惩罚量，以百分点计，按敌方实力缩放之前的数值。惩罚不会降到零以下，因此稳定度绝不会升至正常水平以上。"
 CAP_RULE_WS_RECOVERY: "请投降：每周战争支持度恢复量"
 CAP_RULE_WS_RECOVERY_DESC: "每周消减的战争支持度惩罚量，以百分点计，按敌方实力缩放之前的数值。惩罚不会降到零以下，因此战争支持度绝不会升至正常水平以上。"
 CAP_RULE_RECOVERY_SCALE: "请投降：按敌方实力缩放恢复量"
 CAP_RULE_RECOVERY_SCALE_DESC: "启用后，交战时的消减量会乘以敌方军队实力与己方军队实力之比（上限为1），因此进攻远比自己弱小的国家几乎无法消减惩罚。和平时期消减量始终为完整值。"
 CAP_OPT_ALL: "所有国家"
 CAP_OPT_AI_ONLY: "仅限AI"
 CAP_OPT_PLAYERS_ONLY: "仅限玩家"
 CAP_OPT_OFF: "关闭"
