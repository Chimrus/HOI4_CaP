l_german:
 CAP_RULE_AFFECTED: "Bitte kapituliert: Betroffene Länder"
 CAP_RULE_AFFECTED_DESC: "Welche Länder bei Annäherung an die Kapitulation einen Malus auf Stabilität und Kriegsunterstützung aufbauen und ihn wieder abbauen, wenn sie weit davon entfernt sind. „Nur KI“ hält die Mechanik von Spielern fern."
 CAP_RULE_LOSS_START: "Bitte kapituliert: Abzug beginnt bei"
 CAP_RULE_LOSS_START_DESC: "Kapitulationsfortschritt, ab dem der wöchentliche Abzug von Stabilität und Kriegsunterstützung beginnt."
 CAP_RULE_LOSS_FULL: "Bitte kapituliert: Maximaler Abzug bei"
 CAP_RULE_LOSS_FULL_DESC: "Kapitulationsfortschritt, bei dem der wöchentliche Abzug sein Maximum erreicht. Zwischen dem Beginn und diesem Wert wächst der Abzug entlang einer easeInOutQuad-Kurve."
 CAP_RULE_STAB_LOSS_MAX: "Bitte kapituliert: Maximaler wöchentlicher Verlust an Stabilität"
 CAP_RULE_STAB_LOSS_MAX_DESC: "Der höchste Betrag, um den der Stabilitätsmalus pro Woche wachsen kann, in Prozentpunkten."
 CAP_RULE_WS_LOSS_MAX: "Bitte kapituliert: Maximaler wöchentlicher Verlust an Kriegsunterstützung"
 CAP_RULE_WS_LOSS_MAX_DESC: "Der höchste Betrag, um den der Kriegsunterstützungsmalus pro Woche wachsen kann, in Prozentpunkten."
 CAP_RULE_MAJOR_SCALE: "Bitte kapituliert: Abzug großer Länder"
 CAP_RULE_MAJOR_SCALE_DESC: "Große Länder (der Spielstatus „Gilt als großes Land“: die größten Industriemächte) verlieren Stabilität und Kriegsunterstützung langsamer: Ihr wöchentlicher Abzug wird mit diesem Wert multipliziert. 100% bedeutet denselben Abzug wie bei allen anderen. Die Erholung bleibt unberührt."
 CAP_RULE_PEN_LIMIT: "Bitte kapituliert: Malusgrenze"
 CAP_RULE_PEN_LIMIT_DESC: "Der höchste Betrag, den der Stabilitätsmalus und der Kriegsunterstützungsmalus jeweils aufbauen können, in Prozentpunkten insgesamt. Der resultierende Wert selbst fällt nie unter −50%."
 CAP_RULE_RECOVERY_BELOW: "Bitte kapituliert: Erholung unterhalb von"
 CAP_RULE_RECOVERY_BELOW_DESC: "Ein Land mit einem Kapitulationsfortschritt unter diesem Wert baut jede Woche seinen Malus auf Stabilität und Kriegsunterstützung ab, im Krieg wie im Frieden. „Aus“ schaltet die Erholung ab."
 CAP_RULE_STAB_RECOVERY: "Bitte kapituliert: Wöchentliche Erholung der Stabilität"
 CAP_RULE_STAB_RECOVERY_DESC: "Wie viel des Stabilitätsmalus pro Woche abgebaut wird, in Prozentpunkten, vor der Skalierung nach der Stärke des Feindes. Der Malus kann nicht unter null sinken, daher steigt die Stabilität nie über ihr normales Niveau."
 CAP_RULE_WS_RECOVERY: "Bitte kapituliert: Wöchentliche Erholung der Kriegsunterstützung"
 CAP_RULE_WS_RECOVERY_DESC: "Wie viel des Kriegsunterstützungsmalus pro Woche abgebaut wird, in Prozentpunkten, vor der Skalierung nach der Stärke des Feindes. Der Malus kann nicht unter null sinken, daher steigt die Kriegsunterstützung nie über ihr normales Niveau."
 CAP_RULE_RECOVERY_SCALE: "Bitte kapituliert: Erholung nach Feindstärke skalieren"
 CAP_RULE_RECOVERY_SCALE_DESC: "Wenn aktiviert, wird der Abbau im Krieg mit dem Verhältnis von Stärke der feindlichen Armeen zur Stärke der eigenen Armee multipliziert (höchstens 1). Ein Angriff auf ein deutlich schwächeres Land baut daher wenig ab. Im Frieden erfolgt der Abbau immer in voller Höhe."
 CAP_OPT_ALL: "Alle Länder"
 CAP_OPT_AI_ONLY: "Nur KI"
 CAP_OPT_PLAYERS_ONLY: "Nur Spieler"
 CAP_OPT_OFF: "Aus"
