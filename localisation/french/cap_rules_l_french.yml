l_french:
 CAP_RULE_AFFECTED: "Rendez-vous, s'il vous plaît : pays concernés"
 CAP_RULE_AFFECTED_DESC: "Quels pays accumulent une pénalité sur la stabilité et le soutien à la guerre à l'approche de la capitulation, et la résorbent lorsqu'ils en sont loin. « IA uniquement » tient les joueurs à l'écart du mécanisme."
 CAP_RULE_LOSS_START: "Rendez-vous, s'il vous plaît : début des pertes à"
 CAP_RULE_LOSS_START_DESC: "Avancée vers la capitulation à partir de laquelle commence la perte mensuelle de stabilité et de soutien à la guerre."
 CAP_RULE_LOSS_FULL: "Rendez-vous, s'il vous plaît : pertes maximales à"
 CAP_RULE_LOSS_FULL_DESC: "Avancée vers la capitulation à laquelle la perte mensuelle atteint son maximum. Entre le seuil de départ et cette valeur, la perte croît selon une courbe easeInOutQuad."
 CAP_RULE_STAB_LOSS_MAX: "Rendez-vous, s'il vous plaît : perte mensuelle maximale de stabilité"
 CAP_RULE_STAB_LOSS_MAX_DESC: "La plus forte hausse mensuelle de la pénalité sur la stabilité, en points de pourcentage."
 CAP_RULE_WS_LOSS_MAX: "Rendez-vous, s'il vous plaît : perte mensuelle maximale de soutien à la guerre"
 CAP_RULE_WS_LOSS_MAX_DESC: "La plus forte hausse mensuelle de la pénalité sur le soutien à la guerre, en points de pourcentage."
 CAP_RULE_PEN_LIMIT: "Rendez-vous, s'il vous plaît : limite de la pénalité"
 CAP_RULE_PEN_LIMIT_DESC: "Le plafond que peuvent atteindre séparément la pénalité sur la stabilité et la pénalité sur le soutien à la guerre, en points de pourcentage au total. La valeur résultante elle-même ne descend jamais sous −50%."
 CAP_RULE_RECOVERY_BELOW: "Rendez-vous, s'il vous plaît : récupération sous"
 CAP_RULE_RECOVERY_BELOW_DESC: "Un pays dont l'avancée vers la capitulation est inférieure à cette valeur résorbe chaque mois sa pénalité sur la stabilité et le soutien à la guerre, en guerre comme en paix. « Désactivé » supprime la récupération."
 CAP_RULE_STAB_RECOVERY: "Rendez-vous, s'il vous plaît : récupération mensuelle de stabilité"
 CAP_RULE_STAB_RECOVERY_DESC: "Part de la pénalité sur la stabilité résorbée par mois, en points de pourcentage, avant application du rapport de forces avec l'ennemi. La pénalité ne peut pas passer sous zéro : la stabilité ne dépasse donc jamais son niveau normal."
 CAP_RULE_WS_RECOVERY: "Rendez-vous, s'il vous plaît : récupération mensuelle de soutien à la guerre"
 CAP_RULE_WS_RECOVERY_DESC: "Part de la pénalité sur le soutien à la guerre résorbée par mois, en points de pourcentage, avant application du rapport de forces avec l'ennemi. La pénalité ne peut pas passer sous zéro : le soutien à la guerre ne dépasse donc jamais son niveau normal."
 CAP_RULE_RECOVERY_SCALE: "Rendez-vous, s'il vous plaît : récupération selon la puissance de l'ennemi"
 CAP_RULE_RECOVERY_SCALE_DESC: "Si l'option est activée, en guerre la résorption est multipliée par le rapport entre la puissance des armées ennemies et celle de votre propre armée (1 au maximum) : s'attaquer à un pays bien plus faible résorbe donc très peu. En temps de paix, la résorption est toujours complète."
 CAP_OPT_ALL: "Tous les pays"
 CAP_OPT_AI_ONLY: "IA uniquement"
 CAP_OPT_PLAYERS_ONLY: "Joueurs uniquement"
 CAP_OPT_OFF: "Désactivé"
