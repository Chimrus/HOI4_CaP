l_japanese:
 CAP_RULE_AFFECTED: "降伏してください: 対象となる国"
 CAP_RULE_AFFECTED_DESC: "降伏に近づくにつれて安定度と戦争協力度のマルス値が蓄積され、降伏から遠いときはそれが解消される国を選びます。「AIのみ」にすると、この仕組みはプレイヤーには適用されません。"
 CAP_RULE_LOSS_START: "降伏してください: 低下が始まる降伏度"
 CAP_RULE_LOSS_START_DESC: "安定度と戦争協力度の毎週の低下が始まる降伏度です。"
 CAP_RULE_LOSS_FULL: "降伏してください: 低下が最大になる降伏度"
 CAP_RULE_LOSS_FULL_DESC: "毎週の低下が最大に達する降伏度です。開始値からこの値までの間は、低下量がeaseInOutQuad曲線に沿って増えていきます。"
 CAP_RULE_STAB_LOSS_MAX: "降伏してください: 週間の安定度低下の上限"
 CAP_RULE_STAB_LOSS_MAX_DESC: "安定度のマルス値が1週間に増加する最大値です。単位はパーセントポイントです。"
 CAP_RULE_WS_LOSS_MAX: "降伏してください: 週間の戦争協力度低下の上限"
 CAP_RULE_WS_LOSS_MAX_DESC: "戦争協力度のマルス値が1週間に増加する最大値です。単位はパーセントポイントです。"
 CAP_RULE_MAJOR_SCALE: "降伏してください: 主要国の低下量"
 CAP_RULE_MAJOR_SCALE_DESC: "主要国(ゲーム本来の「主要国」の地位を持つ国。最大の工業国)は、安定度と戦争協力度の低下が遅くなります。毎週の低下量にこの値が掛かります。100%なら他の国と同じ低下量です。回復には影響しません。"
 CAP_RULE_PEN_LIMIT: "降伏してください: マルス値の上限"
 CAP_RULE_PEN_LIMIT_DESC: "安定度のマルス値と戦争協力度のマルス値がそれぞれ蓄積できる最大値です。単位は合計のパーセントポイントです。結果の値自体が−50%を下回ることはありません。"
 CAP_RULE_RECOVERY_BELOW: "降伏してください: この降伏度未満で回復"
 CAP_RULE_RECOVERY_BELOW_DESC: "降伏度がこの値未満の国は、戦争中でも平時でも、毎週、安定度と戦争協力度のマルス値が解消されます。「オフ」にすると回復は行われません。"
 CAP_RULE_STAB_RECOVERY: "降伏してください: 週間の安定度回復"
 CAP_RULE_STAB_RECOVERY_DESC: "敵の戦力による補正を掛ける前の、毎週解消される安定度のマルス値の量です。単位はパーセントポイントです。マルス値は0を下回らないため、安定度が通常の水準を超えて上がることはありません。"
 CAP_RULE_WS_RECOVERY: "降伏してください: 週間の戦争協力度回復"
 CAP_RULE_WS_RECOVERY_DESC: "敵の戦力による補正を掛ける前の、毎週解消される戦争協力度のマルス値の量です。単位はパーセントポイントです。マルス値は0を下回らないため、戦争協力度が通常の水準を超えて上がることはありません。"
 CAP_RULE_RECOVERY_SCALE: "降伏してください: 回復に敵の戦力を反映"
 CAP_RULE_RECOVERY_SCALE_DESC: "有効にすると、戦争中の解消量に自軍の戦力に対する敵軍の戦力の比率(上限は1)が掛かります。そのため、はるかに弱い国を攻めてもマルス値はほとんど解消されません。平時の解消量は常に満額です。"
 CAP_OPT_ALL: "すべての国"
 CAP_OPT_AI_ONLY: "AIのみ"
 CAP_OPT_PLAYERS_ONLY: "プレイヤーのみ"
 CAP_OPT_OFF: "オフ"
